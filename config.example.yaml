# ============================================================================
# EDITH trading bot - ornek konfigurasyon
# Kopyala:  cp config.example.yaml config.yaml
# ============================================================================

mode: paper            # paper | testnet | live  (CLI komutu bunu ezer)
# GENISLIK = getirinin ana kaldiraci.
# Kucuk ama pozitif bir edge'i buyutmenin yolu kaldirac degil, daha cok
# bagimsiz islem. Portfoy backtesti (20 sembol, 5 yil, risk %0.75):
#   2 slot -> yillik %7.4  | 5 slot -> yillik %15.4 | 8 slot -> yillik %22.5
# Dusus her ucunde ~%24 civari. Yani slot artirmak riski ayni tutup
# getiriyi buyutuyor -- kaldirac artirmak ise ikisini birden buyutur.
# UYARI: kripto pozisyonlari yuksek korelasyonlu. 5 acik long, cokuste
# tek buyuk pozisyon gibi davranir. 4 slot bilincli bir orta yol.
symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT
  - DOTUSDT
  - LTCUSDT
  - ATOMUSDT
  - TRXUSDT
  - UNIUSDT
  - AAVEUSDT
# 4h SECILDI, keyfi degil: 5 sembol / 5 yil backtest sonucu (bkz. README "Kanit")
#   5m  -> -0.30R/islem   15m -> -0.25R   1h -> -0.056R   4h -> +0.056R
# Sebep: komisyon+slipaj fiyatin %0.14'u. Stop mesafesi %0.5 ise bu 0.28R,
# stop %3 ise 0.05R. Kisa zaman dilimi = dar stop = komisyonun yendigi oyun.
timeframe: 4h
loop_seconds: 60
state_path: data/bot.db
log_path: logs/bot.log

account:
  quote_asset: USDT
  leverage: 5          # ISTENEN kaldirac. Gercek kaldirac stop mesafesine gore asagi cekilir.
  margin_type: ISOLATED   # Her zaman ISOLATED: bir islem tum hesabi likide edemesin
  paper_start_balance: 200

risk:
  # --- Buradaki tek sayi, botun karakterini belirler ---
  risk_per_trade_pct: 0.75    # Tek islemde equity'nin %0.75'i. 200$ hesapta = 1.50$ risk.
  max_leverage: 10            # Sert tavan. Stop mesafesi gerektirirse bot bunu da kullanmaz.
  max_position_notional_pct: 300   # Notional tavani (equity'nin %'si)
  daily_loss_limit_pct: 4     # Gunluk -%4'te bot kendini kapatir (UTC gunu)
  daily_profit_target_pct: 6  # Gunluk +%6'da durur. Kazandiktan sonra devam etmek en pahali aliskanlik.
  max_trades_per_day: 8      # 15 sembolde 4h; bu bir emniyet supabi
  max_concurrent_positions: 4   # bkz. yukaridaki genislik/korelasyon notu
  max_consecutive_losses: 3
  cooldown_minutes_after_loss: 20
  cooldown_minutes_after_streak: 240
  min_reward_risk: 1.5        # Bunun altina inme. 1.5R altinda beklenti komisyona yenilir.
  max_stop_vs_liquidation: 0.6  # Stop, likidasyon mesafesinin en fazla %60'i kadar uzakta olabilir
  min_free_margin_pct: 25     # Serbest marjin %25'i her zaman bos kalir

strategy:
  name: trend_pullback
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  min_adx: 22            # Yatay piyasada islem yok. Yukselt -> daha az ama daha secici islem.
  rsi_long_min: 45
  rsi_long_max: 72       # Asiri uzamis fiyati kovalama
  rsi_short_min: 28
  rsi_short_max: 55
  atr_pct_min: 0.30      # ATR/fiyat < %0.30 -> hareket komisyonu karsilamaz
  atr_pct_max: 2.5       # ATR/fiyat > %2.5 -> yuksek volatilitede beklenti duser (monoton, bkz README)
  pullback_lookback: 6
  swing_lookback: 10
  stop_atr_mult: 2.5     # Stop mesafesi tavani (ATR cinsinden). Genis stop = dusuk komisyon yuku.
  stop_buffer_atr: 0.25
  tp1_r: 1.0             # Pozisyonun yarisi 1R'de alinir -> islem bedava hale gelir
  tp1_size_pct: 50
  tp2_r: 4.0             # Kalan yarim 4R'de veya iz suren stopta (kazananlar kossun)
  breakeven_at_r: 1.0
  trail_atr_mult: 3.0
  max_bars_in_trade: 200 # 4h'te ~33 gun. Trend takibinde erken cikmak en pahali hatadir.
  warmup_bars: 300

execution:
  taker_fee: 0.0005      # BNB ile komisyon odersen 0.00045'e duser
  maker_fee: 0.0002
  slippage_bps: 2
  max_spread_bps: 6      # Spread bundan genisse islem yok
  avoid_funding_minutes: 10
  funding_rate_abort: 0.0006
  recv_window: 5000
  request_timeout: 10
  max_retries: 4

# ============================================================================
# OGRENME KATMANI
# ============================================================================
# Onemli: "ogrenen bot" fikri, yanlis kurulursa calisan bir sistemi bozmanin
# en guvenilir yoludur. Islem basi beklenti +0.11R, standart sapma ~1.3R.
# 10 islemlik bir serinin standart hatasi 0.41R -- yani gercek beklentinin
# 4 kati. Kisa serilerde OGRENILECEK HICBIR SEY YOKTUR.
#
# Olculdu (portfoy backtesti, 5 yil): esikleri 5 isleme dusurup onseli
# kaldirinca beklenti +0.088R'den +0.041R'ye dustu, t 2.15'ten 0.93'e indi.
# Yani "daha hizli ogrenen" bot, edge'ini yiyen bottur.
#
# Bu yuzden ogrenme burada asimetrik:
#   HIZLI (deterministik) : emir reddi, min notional, marj hatasi -> 3 tekrar
#   YAVAS (istatistiksel) : kova beklentisi, stop genisligi -> 30+ islem + %95
#   HIC                   : "son 3 islem zarardi, strateji degistir"
learning:
  enabled: true

  # --- yavas ogrenme (istatistiksel kapilar) ---
  min_trades_per_bucket: 30    # bu sayinin altinda hicbir karar alinmaz
  min_trades_for_sizing: 40    # risk carpani icin daha da fazlasi gerekir
  # Bir kovayi banklamak icin ortalamanin negatif olmasi YETMEZ; ust guven
  # sinirinin de sifirin altinda olmasi gerekir.
  # z neden 2.33 (tek yonlu %99), 1.64 (%95) degil: her islemden sonra test
  # etmek nominal hatayi asar. Simulasyon (200 islem, 3000 tekrar, gercek
  # beklenti +0.11R olan bir sembolde YANLIS bank orani):
  #   z=1.64, her islem     -> %6.1     z=2.33, her 10 islem -> %0.7
  #   z=3.09, her 10 islem  -> %0.1 ama -0.3R yakalama gucu %98'den %66'ya duser
  # Secilen ayar: yanlis alarm 9 kat azaliyor, gercekten bozuk sembol (-0.6R)
  # hala %100 yakalaniyor.
  significance_z: 2.33
  bench_eval_every: 10         # bank testi her 10 islemde bir
  prior_expectancy_r: 0.11     # backtest beklentisi = onsel inanc
  prior_strength: 40           # onsele 40 islemlik guven verilir (Bayesci kucultme)
  trade_r_sd: 1.3
  bench_days: 14               # kanitlanmis negatif kova kac gun disarida kalir
  probation_multiplier: 0.6    # banktan donen kova kucuk pozisyonla baslar

  # --- risk olcegi ---
  max_risk_multiplier: 1.0     # 1.0 = ogrenme riski ASLA ARTIRAMAZ (tek yonlu emniyet)
  min_risk_multiplier: 0.6
  # Olculdu: ~3 puan CAGR maliyetine ~4 puan dusus azaltiyor. Risk-getiri
  # oranini iyilestirmiyor, sadece olcegi kucultuyor. Sermaye korumasini
  # getiriye tercih ediyorsan true yap.
  drawdown_scaling: false
  drawdown_full_cut_pct: 25

  # --- stop kalibrasyonu: olculen tek net kazanc ---
  # Stop yedikten sonra fiyat N mum icinde orijinal hedefe ulastiysa bu bir
  # "stop avlanmasi": yon dogruydu, stop cok dardi. Oran esigi asinca stop
  # mesafesi ogrenilerek genisletilir, R katlari korunarak.
  stop_calibration: true
  stop_hunt_lookback_bars: 12
  stop_hunt_rate_threshold: 0.45
  stop_widen_step: 0.15
  stop_widen_max: 1.5

  # --- hizli ogrenme (operasyonel hatalar) ---
  # Bunlar sans degil kural: min notional yetmiyorsa yetmiyordur.
  mistake_repeat_threshold: 3
  mistake_block_days: 7

# ============================================================================
# KENDINI DENETLEME
# ============================================================================
# Botu calistiran kisinin istatistik bilmesi gerekmiyor; ama birinin su
# soruyu cevaplamasi gerekiyor: "su an her sey yolunda mi?"
#   python -m bot doctor
#
# Tek yonlu kural: kanit stratejinin bozuldugunu gosterirse bot yeni pozisyon
# acmayi DURDURUR ve haber verir. Parametrelerini kendiliginden degistirmez.
# Kendini yeniden optimize eden bir sistem bozuldugunu asla soylemez, cunku
# her seferinde gecmise uyan yeni bir parametre bulur.
health:
  enabled: true
  check_every_minutes: 60

  # Edge oldu mu kontrolu. 50 islem + %99 anlamlilik gerekiyor: amac kotu bir
  # aya tepki vermek DEGIL, edge'in gercekten bittigini yakalamak.
  # 12 ardisik zarar bu kontrolu tetiklemez -- tetiklememesi gerekir.
  min_trades_for_edge_check: 50
  edge_z: 2.33
  halt_on_dead_edge: true

  drawdown_warn_pct: 15      # backtest'te en kotu dusus %21 idi, bu NORMAL
  drawdown_critical_pct: 22
  fee_drag_warn_pct: 40      # brut karin %40'indan fazlasi komisyona gidiyorsa
  notify_on_warn: false      # sadece 'mudahale' seviyesi bildirim gonderir

# ============================================================================
# GOLGE MODU (otonom kendini koruma)
# ============================================================================
# Stratejinin edge'i olurse ne olacak? Uc secenek var:
#   a) Dur ve insani bekle          -> otonom degil; sen uyuyorsan sistem oludur
#   b) Parametreleri yeniden ayarla -> bozulmayi gizler; olculdu, beklentiyi
#                                      +0.088R'den +0.041R'ye dusuruyor
#   c) GOLGE MODU                   -> islem yapmaya devam et, ama kagit uzerinde
#
# (c) secildi. Bot sinyal uretmeye, pozisyon acmaya, yonetmeye ve kapatmaya
# devam eder; sadece borsaya emir gitmez. Kanit geri gelirse KENDILIGINDEN
# canliya doner. Gelmezse sonsuza kadar golgede kalir ve sermaye korunur.
#
# Neden "dur ve bekle"den iyi: durmak bilgi uretmez. Golge modu olcmeye
# devam eder, boylece "gercekten bozuldu mu yoksa gecici rejim mi" sorusu
# cevaplanabilir. Durmus bir bot bunu asla ogrenemez.
#
# Neden "yeniden optimize et"ten iyi: golge modu parametreleri DEGISTIRMEZ.
# Ayni strateji, ayni ayarlar, sadece para yok. Geri donus karari gercek bir
# sinavdir, gecmise uydurulmus bir parametre degil.
shadow:
  enabled: true
  # Asimetri kasten:
  #   golgeye GECMEK icin  -> beklentinin NEGATIF oldugu kanitlanmali (health)
  #   canliya DONMEK icin  -> beklentinin POZITIF oldugu kanitlanmali (burasi)
  # Supheli durumda sermaye risk almaz.
  min_trades_to_resume: 40   # golgede en az bu kadar sanal islem
  resume_z: 1.64             # alt guven siniri > 0 (tek yonlu %95)
  notify_on_transition: true
